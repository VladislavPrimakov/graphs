name: Deploy Astro Site to GitHub Pages

on:
  schedule:
    # Run automatically every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Cache pipeline datasets
        uses: actions/cache@v4
        with:
          path: |
            pipelines/**/cache
            ~/.cache/kagglehub
          key: pipeline-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pipeline-cache-${{ runner.os }}-
            pipeline-cache-

      - name: Run ETL data pipelines
        run: |
          python pipelines/run_all.py -u

      - name: Commit and push updated datasets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add site/src/data/*.json pipelines/space_launches/cache/launches_base.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): daily automated dataset refresh [skip ci]"
            git push origin main
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'site/package-lock.json'

      - name: Install dependencies
        working-directory: ./site
        run: npm ci

      - name: Build Astro site
        working-directory: ./site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Astro Site to GitHub Pages

on:
  schedule:
    # Run automatically every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Cache pipeline datasets
        uses: actions/cache@v4
        with:
          path: |
            pipelines/**/cache
          key: pipeline-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pipeline-cache-${{ runner.os }}-
            pipeline-cache-

      - name: Run ETL data pipelines
        run: bun run pipelines
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      - name: Build Astro site
        run: bun run site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
